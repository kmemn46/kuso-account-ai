name: CDK Diff on Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "infra/**"
      - "packages/**"
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cdk-diff.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  cdk-diff-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      
      # ルートで全ワークスペースの依存関係をインストール
      - name: Install workspace dependencies
        run: npm ci
      
      # パッケージと Lambda レイヤーをビルド（正確な diff 取得のため）
      - name: Build packages and Lambda layer
        run: |
          npm run build:packages
          npm --prefix infra run build:layer

      # dev 環境の cdk diff を実行して結果を保存
      - name: Run cdk diff for dev
        working-directory: infra
        continue-on-error: true
        id: diff
        run: |
          set +e
          npx cdk diff InfraStack-dev -c env=dev > diff-output.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      # 折りたたまれた形式で PR コメントを投稿・更新
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EXIT_CODE: ${{ steps.diff.outputs.exit_code }}
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            const rawDiff = fs.existsSync("infra/diff-output.txt")
              ? fs.readFileSync("infra/diff-output.txt", "utf8")
              : "";

            // ターミナル用の色コード（ANSIエスケープシーケンス）を取り除いて読みやすくする
            const cleanDiff = rawDiff.replace(/\u001b\[[0-9;]*m/g, "").trim() || "No diff output.";

            // GitHub コメントの文字数制限対策として長すぎる場合は切り詰める
            const maxLength = 60000;
            const truncatedDiff = cleanDiff.length > maxLength
              ? cleanDiff.slice(0, maxLength) + "\n... (出力が長いため一部を省略しました)"
              : cleanDiff;

            // 同じ PR で更新されたときに既存コメントを書き換えるための目印
            const marker = "<!-- cdk-diff-infra-stack-dev -->";
            const statusText = process.env.EXIT_CODE === "0" ? "Success" : "Exited with non-zero";

            const body = [
              marker,
              "### 🔍 CDK Diff (`InfraStack-dev` / `env=dev`)",
              "",
              `Status: **${statusText}**`,
              "",
              "<details>",
              "<summary>クリックして cdk diff の詳細を表示</summary>",
              "",
              "```diff",
              truncatedDiff,
              "```",
              "",
              "</details>"
            ].join("\n");

            fs.writeFileSync("comment-body.md", body);

            const listJson = execSync(
              `gh api repos/${process.env.REPO}/issues/${process.env.PR_NUMBER}/comments`,
              { encoding: "utf8" }
            );
            const comments = JSON.parse(listJson);
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              execSync(
                `gh api --method PATCH repos/${process.env.REPO}/issues/comments/${existing.id} -F body=@comment-body.md`,
                { stdio: "inherit" }
              );
            } else {
              execSync(
                `gh pr comment ${process.env.PR_NUMBER} --body-file comment-body.md`,
                { stdio: "inherit" }
              );
            }
